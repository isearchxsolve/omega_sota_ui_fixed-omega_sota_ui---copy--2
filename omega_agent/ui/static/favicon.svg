<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Slate 900 to 950) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- OMEGA Symbol Gradient (Cyan to Blue) -->
    <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- SOTA Cyberpunk Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Grid Overlay -->
  <rect width="512" height="512" rx="120" fill="url(#grid)" />

  <!-- Inner Border for depth -->
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Centered OMEGA Symbol -->
  <!-- Bounding box of path is perfectly mapped to center via scale(16) & translate(64) -->
  <g transform="translate(64, 64) scale(16)" filter="url(#glow)">
    <path d="M 3 20 h 4.5 a 0.5 0.5 0 0 0 0.5 -0.5 v -0.282 a 0.52 0.52 0 0 0 -0.247 -0.437 a 8 8 0 1 1 8.494 0 a 0.52 0.52 0 0 0 -0.247 0.437 v 0.282 a 0.5 0.5 0 0 0 0.5 0.5 h 4.5" 
          fill="none" 
          stroke="url(#omegaGrad)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>